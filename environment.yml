name: solweig
channels:
  - conda-forge
dependencies:
  # Versions used for every result in this repo (30 Oct 2026); full lock in environment.lock.yml.
  - python=3.11
  - gdal=3.13.3
  - numpy=2.4.6
  - numpy
  - scipy
  - pandas
  - matplotlib
  - xarray
  - netcdf4
  - pytest
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.5.1
      - solweig-gpu==2.0.0
      - SALib==1.6.0
      - numba==0.68.1  # imported by solweig-gpu but not declared as a dependency
